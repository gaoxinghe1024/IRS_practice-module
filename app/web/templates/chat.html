{% extends "base.html" %}
{% block content %}
<h1>{{ t("chat.title") }}</h1>
<div class="chat-layout">
  <aside class="panel chat-sessions" aria-labelledby="sessions-title">
    <div class="row-between"><h2 id="sessions-title">{{ t("chat.sessions") }}</h2>
      <button type="button" class="small" id="new-chat">{{ t("chat.new") }}</button></div>
    <nav id="session-list" aria-label="{{ t('chat.sessions') }}"></nav>
  </aside>
  <section class="panel" aria-label="{{ t('chat.title') }}">
    <div id="capability-notes"></div>
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="composer" class="composer">
      <label for="message" class="visually-hidden">{{ t("chat.placeholder") }}</label>
      <textarea id="message" name="message" rows="2" maxlength="1000" placeholder="{{ t('chat.placeholder') }}"></textarea>
      <button type="submit" id="send">{{ t("chat.send") }}</button>
    </form>
    <div class="examples"><span class="muted">{{ t("chat.examples") }}</span><span id="examples" class="chips"></span></div>
    <div id="image-box" class="hidden spaced">
      <label for="image-input">{{ t("chat.upload") }}</label>
      <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp">
      <p class="muted">{{ t("chat.upload_note") }}</p>
      <div id="image-results"></div>
    </div>
  </section>
</div>
{% endblock %}
