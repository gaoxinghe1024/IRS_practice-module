<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主页推荐 · AnimeFinder</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">アニ</span>
      <div><h1>AnimeFinder</h1><p>能听懂人话的找番系统</p></div>
    </div>
    <nav>
      <a class="nav-btn" data-page="home" href="/">🏠 主页推荐</a>
      <a class="nav-btn" data-page="explore" href="/static/explore.html">🔍 浏览全部</a>
      <a class="nav-btn" data-page="chat" href="/static/chat.html">💬 聊天找番</a>
    </nav>
    <div class="user-box">
      <label>当前用户</label>
      <select id="userSelect">
        <option value="1">demo（收藏：心理/智斗系）</option>
        <option value="2">visitor（收藏：热血战斗系）</option>
      </select>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h2>为你推荐</h2>
      <p class="sub">协同过滤（ICF）召回候选 + 遗传算法（GA）列表级优化</p>
    </div>
    <div id="gaInfo" class="ga-info"></div>
    <div id="homeList" class="grid"></div>

    <!-- 观看计划优化（GA 组合优化） -->
    <div class="page-head" style="margin-top:34px">
      <h2>观看计划优化</h2>
      <p class="sub">遗传算法组合优化：给定时间预算，输出兼顾偏好 / 总分 / 多样性的整份计划</p>
    </div>
    <div class="plan-panel">
      <div class="plan-inputs">
        <label>时间预算 <input id="planHours" type="number" value="15" min="1" max="60"> 小时</label>
        <label>偏好关键词 <input id="planKeywords" placeholder="逗号分隔，如：心理,悬疑"></label>
        <button id="planBtn" class="btn primary">生成计划</button>
      </div>
      <div id="planResult"></div>
    </div>
  </main>
</div>

<!-- 详情弹窗（共享组件，结构在 common.js 渲染） -->
<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/home.js"></script>
</body>
</html>
