<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · AnimeFinder</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">アニ</span>
      <div><h1>AnimeFinder</h1><p>能听懂人话的找番系统</p></div>
    </div>
    <nav>
      <a class="nav-btn" data-page="home" href="/">🏠 主页推荐</a>
      <a class="nav-btn" data-page="explore" href="/static/explore.html">🔍 浏览全部</a>
      <a class="nav-btn" data-page="chat" href="/static/chat.html">💬 聊天找番</a>
      <a class="nav-btn" data-page="favorites" href="/static/favorites.html">⭐ 我的收藏</a>
      <a class="nav-btn" data-page="profile" href="/static/profile.html">👤 个人中心</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </aside>

  <main class="main">
    <div id="profileContent">
      <!-- 用户信息卡 -->
      <div id="profileCard" class="profile-card"></div>

      <!-- 偏好标签 -->
      <div class="section-title">你的偏好画像 <span style="font-weight:400;color:var(--muted);font-size:12px">来自评分 ≥ 8 的作品 genre 分布</span></div>
      <div id="genreChips" class="detail-meta"></div>

      <!-- 历史评分 -->
      <div class="section-title">历史评分 <span style="font-weight:400;color:var(--muted);font-size:12px">真实评分记录，按时间倒序</span></div>
      <div id="historyList" class="history-list"></div>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/profile.js"></script>
</body>
</html>
