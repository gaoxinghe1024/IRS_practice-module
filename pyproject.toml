[project]
name = "anilogic"
version = "2.0.0"
description = "AniLogic: Your ACG Friend - anime discovery, recommendation, grounded chat and viewing plans"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Course project (NUS-ISS IRS practice module)" }
authors = [
  { name = "Gao Xinghe" },
  { name = "Lin Kai" },
  { name = "Sun Yancheng" },
  { name = "Yu Yuchen" },
]
# Base mode: everything needed to run the full app on synthetic or real data
# without deep-learning extras. Exact versions are pinned in uv.lock.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<0.1",
  "sqlalchemy>=2.0.30,<2.2",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.13,<2.0",
  "pandas>=2.2,<4.0",
  "pyarrow>=16.0,<30.0",
  "scikit-learn>=1.5,<2.0",
  "rapidfuzz>=3.9,<4.0",
  "pillow>=10.4,<13.0",
]

[project.optional-dependencies]
# Neural models (MF runs in numpy; NCF / Two-Tower / BGE / CLIP need these).
ml = [
  "torch>=2.4,<3.0",
  "sentence-transformers>=3.0,<7.0",
]
# Optional Anthropic provider for the chat adapter (official SDK).
llm = [
  "anthropic>=1.0,<2.0",
]
dev = [
  "pytest>=8.2,<10.0",
  "playwright>=1.45,<2.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
anilogic = "pipelines.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipelines", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "e2e: browser journeys (need a running server and Playwright browsers)",
  "ml: tests that need the optional torch / sentence-transformers extras",
  "real: tests that need the real Kaggle files under data/raw/mal_2023",
]
filterwarnings = [
  "ignore::DeprecationWarning:sklearn.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
